name: 2-trabalho-entre-jobs

# Definindo o trigger
on:
  workflow_dispatch 

jobs:
  # Cada JOB roda em um ambiente direfente em PARALELO
  # Os steps do mesmo job compartilham informações
  job1:
    runs-on: ubuntu-latest # Runner
    steps: # Steps no mesmo JOB são executados em SEQUENCIA
      - name: Confere versao do ubuntu
        run: cat /etc/os-release
      
      - name: Escrever uma mensagem
        run: echo "Primeiro workflow" > ${{ github.workspace }}/mensagem.txt

      - name: Ler mensagem
        run: cat mensagem.txt

      - uses: actions/upload-artifact@v4 # Copia o arquivo mensagem.txt
        with:
            name: diretorio_x
            path: mensagem.txt


  job2:
    runs-on: ubuntu-latest # Runner
    steps:
      - name: Ver exite message.txt
        run: ls -la

      - uses: actions/download-artifact@v4 # Copia o arquivo mensagem.txt
        with:
            name: diretorio_x
            path: mensagem.txt
      
      - name: Ver denovo exite message.txt
        run: ls -la; ls -la diretorio_x